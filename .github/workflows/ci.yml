name: CI

on:
  push:
    branches:
      - master
      - 'chore/**'
      - 'fix/**'
      - 'feat/**'
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run unit tests
        run: |
          make clean
          make test IVERILOG=iverilog VVP=vvp
