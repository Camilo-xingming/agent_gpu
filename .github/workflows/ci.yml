name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Verilator Lint
        run: make lint VERILATOR=verilator

  test:
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make test IVERILOG=iverilog VVP=vvp

  frm-compare:
    runs-on: self-hosted
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Generate tests and run RTL-FRM compare
        run: |
          python3 tools/test_generator.py --gen all
          python3 tools/rtl_frm_compare.py --all
