name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_JSON != '' && vars.CI_RUNS_ON_JSON || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Verilator Lint
        run: make lint VERILATOR=verilator

  synth:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_JSON != '' && vars.CI_RUNS_ON_JSON || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: "DoD #4: Yosys Synthesis Check"
        run: make synth
      - name: Post synth failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          errors=$(grep -iE 'error|ERROR|assert' build/yosys_synth.log 2>/dev/null | head -30 || echo "No log found. See CI run.")
          body=$(printf '**❌ Synthesis Failed (DoD #4)**\n\n```\n%s\n```\n\nFix synthesis errors before merge. [Full log](%s).' "$errors" "$RUN_URL")
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$body"

  unit-test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_JSON != '' && vars.CI_RUNS_ON_JSON || '["self-hosted","macOS","ARM64"]') }}
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run Unit Test Suite
        run: make test IVERILOG=iverilog VVP=vvp

  dod-check:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_JSON != '' && vars.CI_RUNS_ON_JSON || '["self-hosted","macOS","ARM64"]') }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin master

      - name: "DoD #3: RTL changes must include test changes"
        run: |
          changed=$(git diff --name-only origin/master...HEAD)
          rtl_changed=$(echo "$changed" | grep -c '^rtl/' || true)
          tb_changed=$(echo "$changed" | grep -c '^tb/' || true)
          if [ "$rtl_changed" -gt 0 ] && [ "$tb_changed" -eq 0 ]; then
            echo "::warning::RTL files changed but no testbench files updated. Reviewer: confirm test coverage."
          fi

      - name: "DoD #6: PR title must reference Issue"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '#[0-9]+'; then
            echo "::error::PR title must reference an Issue (e.g. 'fix #123: description')"
            exit 1
          fi

      - name: "DoD #7: PR description must include required sections"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=""
          echo "$PR_BODY" | grep -qi 'background\|背景' || missing="$missing background/背景"
          echo "$PR_BODY" | grep -qi 'changes\|变更\|what' || missing="$missing changes/变更"
          echo "$PR_BODY" | grep -qi 'test\|测试' || missing="$missing test/测试"
          if [ -n "$missing" ]; then
            echo "::error::PR description missing required sections:$missing"
            exit 1
          fi

      - name: "DoD #8: No debug temp code"
        run: |
          if git diff --name-only origin/master...HEAD -- 'rtl/*.v' 'rtl/*.sv' | \
             xargs -r grep -n '\$display\|\$monitor\|\$dumpvars' 2>/dev/null | \
             grep -v '// keep' | head -20; then
            echo "::error::Found debug statements in RTL files. Remove before merge."
            exit 1
          fi

      - name: "DoD #10: Cross-review with agent name"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          reviews=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews \
            --jq '[.[] | select(.state == "APPROVED")] | length')
          reviewers=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews \
            --jq '[.[] | select(.state == "APPROVED") | .user.login] | join(", ")')
          author_reviewed=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews \
            --jq '[.[] | select(.state == "APPROVED" and .user.login == env.PR_AUTHOR)] | length')
          cross_reviews=$((reviews - author_reviewed))
          if [ "$cross_reviews" -lt 1 ]; then
            echo "::error::Need at least 1 cross-review from a different agent. Current approvals: ${reviewers:-none}"
            exit 1
          fi
          echo "✅ Cross-review passed. Reviewers: $reviewers"

  regression:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_JSON != '' && vars.CI_RUNS_ON_JSON || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Run make test
        run: make test VERILATOR=verilator
