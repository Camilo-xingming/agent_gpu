name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Verilator Lint
        run: make lint VERILATOR=verilator

  regression:
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Generate tests
        run: python3 tools/test_generator.py --gen all
      - name: Run Audited Regression Suite
        run: make regression IVERILOG=iverilog VVP=vvp
