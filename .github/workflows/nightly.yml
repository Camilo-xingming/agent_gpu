name: Nightly Regression

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:       # manual trigger

jobs:
  full-regression:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_JSON != '' && vars.CI_RUNS_ON_JSON || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Verilator Lint
        run: make lint VERILATOR=verilator

      - name: Unit tests
        run: make test IVERILOG=iverilog VVP=vvp

      - name: Full test suite
        run: make test_all IVERILOG=iverilog VVP=vvp

      - name: Generate and run RTL-FRM compare (all)
        run: |
          python3 tools/test_generator.py --gen all
          python3 tools/rtl_frm_compare.py --all

      - name: Performance benchmarks
        run: |
          make bench_atomics IVERILOG=iverilog VVP=vvp || true
          make bench_divergence IVERILOG=iverilog VVP=vvp || true
          make perf_report || true

      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report-${{ github.run_number }}
          path: |
            build/
          retention-days: 30
