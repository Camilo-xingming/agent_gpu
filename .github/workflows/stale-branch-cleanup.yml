name: Stale Branch Cleanup

on:
  schedule:
    - cron: '30 3 * * 1' # Weekly Monday 03:30 UTC
  workflow_dispatch:
    inputs:
      stale_days:
        description: 'Delete branches merged before this many days'
        required: false
        default: '14'
      dry_run:
        description: 'Only report candidates, do not delete'
        required: false
        default: true
        type: boolean

jobs:
  cleanup:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_JSON != '' && vars.CI_RUNS_ON_JSON || '["self-hosted","macOS","ARM64"]') }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Run stale branch cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STALE_DAYS: ${{ inputs.stale_days }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          STALE_DAYS="${INPUT_STALE_DAYS:-14}"
          DRY_RUN_FLAG=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN:-true}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python3 scripts/cleanup_stale_branches.py \
            --repo "$REPO" \
            --stale-days "$STALE_DAYS" \
            $DRY_RUN_FLAG
